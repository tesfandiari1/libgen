[project]
name = "langgraph-agents"
version = "0.1.0"
description = "LangGraph agents implementation with memory and tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6.4",
    "langchain>=0.3.27",
    "langchain-anthropic>=0.3.18",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "sqlalchemy>=2.0.42",
    "pandas>=2.3.1",
    "httpx>=0.28.1",
    "selectolax>=0.3.33",
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.0",
    "tenacity>=9.1.2",
    "aiofiles>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]



[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

# Task 4: Tooling configuration
[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I"]
exclude = [
    ".venv",
    "data",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
pretty = true
warn_unused_ignores = false
ignore_missing_imports = true
explicit_package_bases = false

